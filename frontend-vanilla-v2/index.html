        <link rel="icon" type="image/x-icon" href="/os/favicon.ico" />
        <meta name="theme-color" content="#000000" />

        <meta property="og:title" content="Windows Xp" />

                        <span>DUST FX</span>
                        <div class="switch" role="switch" aria-checked="true" aria-label="Toggle dust effects" tabindex="0" data-setting="particles"><div class="switch-knob"></div></div>
                    </div>
                    <div class="settings-row">
                        <span>CRT FX</span>
                        <div class="switch" role="switch" aria-checked="true" aria-label="Toggle CRT effects" tabindex="0" data-setting="glitch"><div class="switch-knob"></div></div>
                    </div>

            <div id="screen" class="screen crt-effects">
